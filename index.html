<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Partner Portal — outtoeat</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#DE3937; --ink-soft:#B32E2C; --paper:#FFFFFF; --paper-dim:#FBEBEA;
    --brass:#C42B29; --brass-bright:#F0524F; --sage:#4F8A5B; --rust:#8A8078;
    --line:#F0D9D8; --text:#241412; --text-dim:#7A6E6A; --radius:4px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper-dim);color:var(--text);font-family:'Work Sans',sans-serif;}

  header{background:var(--ink);color:#fff;padding:24px 24px;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:22px;}
  .brand-sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#FBDAD9;margin-top:2px;}

  main{max-width:520px;margin:0 auto;padding:40px 20px 80px;}

  .card{background:#FFFDF8;border:1px solid var(--line);border-radius:10px;padding:28px;margin-bottom:20px;}
  h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 20px;}

  .tabs{display:flex;gap:0;margin-bottom:24px;}
  .tab{flex:1;text-align:center;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;border-bottom:2px solid var(--line);color:var(--text-dim);}
  .tab.active{color:var(--ink);border-color:var(--ink);font-weight:600;}

  label{display:block;font-size:13px;color:var(--text-dim);margin:14px 0 5px;}
  input{width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:var(--radius);font-family:'Work Sans',sans-serif;}
  input:focus{outline:2px solid var(--brass-bright);outline-offset:1px;}

  button{
    width:100%;margin-top:20px;padding:12px;font-size:14px;font-weight:600;
    background:var(--ink);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;
  }
  button:hover{background:var(--brass-bright);}
  button.secondary{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  button.secondary:hover{background:var(--paper-dim);}

  .msg{font-size:13px;padding:10px 12px;border-radius:var(--radius);margin-top:14px;}
  .msg.error{background:#FCEBEB;color:#791F1F;}
  .msg.success{background:#EAF3DE;color:#27500A;}

  .row{display:flex;gap:10px;}
  .row > div{flex:1;}

  .slot-list, .booking-list{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
  .slot-item, .booking-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;background:var(--paper-dim);border-radius:var(--radius);font-size:13px;
  }
  .booking-item{flex-direction:column;align-items:flex-start;gap:2px;}
  .booking-item .top{display:flex;justify-content:space-between;width:100%;font-weight:600;}
  .booking-item .meta{color:var(--text-dim);font-size:12px;}

  .empty{color:var(--text-dim);font-size:13px;padding:16px 0;text-align:center;}
  .logout{background:none;border:none;color:#FBDAD9;font-size:12px;text-decoration:underline;cursor:pointer;padding:0;width:auto;margin:0;float:right;}
</style>
</head>
<body>

<header>
  <div class="brand">outtoeat <span style="font-weight:400;font-size:14px;">partner portal</span></div>
  <div class="brand-sub">Manage your restaurant's bookings</div>
</header>

<main>
  <div id="authView">
    <div class="card">
      <div class="tabs">
        <div class="tab active" id="tabLogin">Log in</div>
        <div class="tab" id="tabSignup">Sign up</div>
      </div>

      <div id="loginForm">
        <h2>Welcome back</h2>
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="you@restaurant.com">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••">
        <button onclick="login()">Log in</button>
        <div id="loginMsg"></div>
      </div>

      <div id="signupForm" style="display:none;">
        <h2>Create your account</h2>
        <label>Restaurant name</label>
        <input id="suName" type="text" placeholder="Your Restaurant Name">
        <label>Google Places ID <span style="font-weight:400;color:var(--text-dim);">(optional — links your listing)</span></label>
        <input id="suPlaceId" type="text" placeholder="ChIJ...">
        <label>Email</label>
        <input id="suEmail" type="email" placeholder="you@restaurant.com">
        <label>Password <span style="font-weight:400;">(min 8 characters)</span></label>
        <input id="suPassword" type="password" placeholder="••••••••">
        <button onclick="signup()">Create account</button>
        <div id="signupMsg"></div>
      </div>
    </div>
  </div>

  <div id="dashboardView" style="display:none;">
    <div class="card">
      <button class="logout" onclick="logout()">Log out</button>
      <h2 id="welcomeName">Dashboard</h2>

      <h3 style="font-family:'Fraunces',serif;font-size:16px;margin:0 0 4px;">Add a time slot</h3>
      <div class="row">
        <div>
          <label>Date</label>
          <input id="slotDate" type="date">
        </div>
        <div>
          <label>Time</label>
          <input id="slotTime" type="time">
        </div>
      </div>
      <label>Tables available at this time</label>
      <input id="slotCapacity" type="number" min="1" value="4">
      <button onclick="addSlot()">Add slot</button>
      <div id="slotMsg"></div>

      <div class="slot-list" id="slotList"></div>
    </div>

    <div class="card">
      <h2>Upcoming bookings</h2>
      <div class="booking-list" id="bookingList"></div>
    </div>
  </div>
</main>

<script>
const API = "https://eat-out-oz.vercel.app/api";
let token = localStorage.getItem("outtoeat_token") || null;
let restaurantName = localStorage.getItem("outtoeat_restaurant_name") || "";

const tabLogin = document.getElementById('tabLogin');
const tabSignup = document.getElementById('tabSignup');
const loginForm = document.getElementById('loginForm');
const signupForm = document.getElementById('signupForm');

tabLogin.onclick = () => { tabLogin.classList.add('active'); tabSignup.classList.remove('active'); loginForm.style.display='block'; signupForm.style.display='none'; };
tabSignup.onclick = () => { tabSignup.classList.add('active'); tabLogin.classList.remove('active'); signupForm.style.display='block'; loginForm.style.display='none'; };

function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

async function signup(){
  const name = document.getElementById('suName').value.trim();
  const placeId = document.getElementById('suPlaceId').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPassword').value;

  if (!name || !email || !password){
    showMsg('signupMsg', 'Please fill in all required fields.', 'error');
    return;
  }

  try {
    const res = await fetch(`${API}/restaurant-signup`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, password, placeId: placeId || null })
    });
    const data = await res.json();
    if (!res.ok){ showMsg('signupMsg', data.error || 'Signup failed.', 'error'); return; }
    showMsg('signupMsg', 'Account created — you can log in now.', 'success');
    tabLogin.click();
    document.getElementById('loginEmail').value = email;
  } catch(err){
    showMsg('signupMsg', 'Something went wrong: ' + err.message, 'error');
  }
}

async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password){ showMsg('loginMsg', 'Enter your email and password.', 'error'); return; }

  try {
    const res = await fetch(`${API}/restaurant-login`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok){ showMsg('loginMsg', data.error || 'Login failed.', 'error'); return; }

    token = data.token;
    restaurantName = data.restaurant.name;
    localStorage.setItem('outtoeat_token', token);
    localStorage.setItem('outtoeat_restaurant_name', restaurantName);
    showDashboard();
  } catch(err){
    showMsg('loginMsg', 'Something went wrong: ' + err.message, 'error');
  }
}

function logout(){
  token = null;
  localStorage.removeItem('outtoeat_token');
  localStorage.removeItem('outtoeat_restaurant_name');
  document.getElementById('authView').style.display = 'block';
  document.getElementById('dashboardView').style.display = 'none';
}

async function addSlot(){
  const date = document.getElementById('slotDate').value;
  const time = document.getElementById('slotTime').value;
  const capacity = parseInt(document.getElementById('slotCapacity').value, 10);

  if (!date || !time || !capacity){ showMsg('slotMsg', 'Fill in date, time and capacity.', 'error'); return; }

  try {
    const res = await fetch(`${API}/slots`, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization': `Bearer ${token}`},
      body: JSON.stringify({ date, time, capacity })
    });
    const data = await res.json();
    if (!res.ok){ showMsg('slotMsg', data.error || 'Failed to add slot.', 'error'); return; }
    showMsg('slotMsg', 'Slot added.', 'success');
    loadDashboard();
  } catch(err){
    showMsg('slotMsg', 'Something went wrong: ' + err.message, 'error');
  }
}

async function loadDashboard(){
  document.getElementById('welcomeName').textContent = restaurantName || 'Dashboard';

  // Load bookings (also tells us the restaurant id indirectly via auth)
  try {
    const res = await fetch(`${API}/my-bookings`, { headers: { 'Authorization': `Bearer ${token}` } });
    const data = await res.json();
    if (!res.ok){
      if (res.status === 401){ logout(); return; }
      throw new Error(data.error);
    }
    const list = document.getElementById('bookingList');
    if (!data.bookings.length){
      list.innerHTML = '<div class="empty">No upcoming bookings yet.</div>';
    } else {
      list.innerHTML = data.bookings.map(b => `
        <div class="booking-item">
          <div class="top"><span>${b.customer_name}</span><span>${b.slot_date} · ${b.slot_time.slice(0,5)}</span></div>
          <div class="meta">${b.party_size} guests · ${b.customer_email}${b.customer_phone ? ' · '+b.customer_phone : ''}</div>
        </div>
      `).join('');
    }
  } catch(err){
    document.getElementById('bookingList').innerHTML = `<div class="msg error">Failed to load bookings: ${err.message}</div>`;
  }
}

function showDashboard(){
  document.getElementById('authView').style.display = 'none';
  document.getElementById('dashboardView').style.display = 'block';
  loadDashboard();
}

if (token) showDashboard();
</script>
</body>
</html>
